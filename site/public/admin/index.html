<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>内容管理</title>
<style>
:root{--bg:#f7f2f3;--card:#fff;--ink:#2b1d22;--dim:#8b7a80;--line:#ecdfe2;--acc:#c8325e;--acc2:#fbe9ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:16px}header .st{font-size:12px;color:var(--dim)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}button.ghost{border-color:transparent;background:transparent;color:var(--dim)}
button:disabled{opacity:.5;cursor:default}
main{max-width:760px;margin:0 auto;padding:14px 12px 120px}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}details.sec>summary .n{color:var(--dim);font-weight:400;font-size:12px;margin-left:auto}
details.sec>summary .pv{font-size:12px;padding:4px 9px}
.body{padding:2px 16px 16px;display:flex;flex-direction:column;gap:14px}
.f>label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
input[type=text],input[type=datetime-local],input[type=number],textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fffdfd;color:var(--ink)}
textarea{min-height:76px;resize:vertical}input:focus,textarea:focus{outline:2px solid var(--acc2);border-color:var(--acc)}
.tip{font-size:12px;color:var(--dim);margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#f1e8ea;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:24px;height:24px;padding:0;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:24px}
.thumb .mv{position:absolute;bottom:4px;left:4px;right:4px;display:flex;justify-content:space-between}.thumb .mv button{width:24px;height:24px;padding:0;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:12px}
.add{aspect-ratio:1;border:1.5px dashed #d7c2c8;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;text-align:center;background:#fffafb}
.single{display:flex;gap:12px;align-items:center}.single .thumb{width:110px;flex:none}
.item{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#fffdfd}
.item .hd{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}.item .hd span{flex:1}
.stages{display:flex;flex-direction:column;gap:6px}.stage{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fffdfd}.stage b{flex:1;font-weight:500}.stage.off b{color:#b9aab0;text-decoration:line-through}
.sw{position:relative;width:42px;height:24px;flex:none}.sw input{opacity:0;width:0;height:0}.sw i{position:absolute;inset:0;border-radius:24px;background:#ddd;transition:.2s}.sw i:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}.sw input:checked+i{background:var(--acc)}.sw input:checked+i:before{transform:translateX(18px)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatches button{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
#login{max-width:340px;margin:18vh auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center}#login h2{margin:0 0 6px}#login p{color:var(--dim);font-size:13px;margin:0 0 16px}#login input{margin-bottom:12px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b1d22;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.bar button{flex:1;max-width:240px;padding:11px}
.help{background:var(--acc2);border-radius:14px;padding:12px 14px;font-size:13px;margin-bottom:12px;color:#6d2840}
audio{width:100%;margin-top:6px}
.busy{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<div id="login" hidden>
  <h2>内容管理</h2><p>输入管理口令后，就可以修改页面上的文字和照片</p>
  <input id="pw" type="password" placeholder="管理口令" autocomplete="current-password">
  <button class="pri" id="loginBtn" style="width:100%">进入</button><p id="loginErr" style="color:#c8325e;margin-top:10px"></p>
</div>
<div id="app" hidden>
  <header><h1>内容管理</h1><span class="st" id="st"></span><button class="ghost" id="histBtn">历史版本</button></header>
  <main>
    <div class="help">改完点底部「保存」，对方再打开网页就是新内容。文字里用 <b>**两个星号**</b> 包住的字会加粗；{收件人} {昵称} {天数} 会自动替换。每次保存都会自动留一份历史版本，改错了可以恢复。</div>
    <div id="form"></div>
  </main>
  <div class="bar"><button id="openBtn">预览整个网页</button><button class="pri" id="saveBtn">保存</button></div>
</div>
<div class="toast" id="toast"></div>
<script src="./admin.js"></script>
</body>
</html>
